[project]
name = "dotscripts"
version = "0.1.0"
description = "Dotfile linking and project triage for machines without Home Manager."
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "rich>=13.7",
]

[project.scripts]
dots = "dotscripts.dots:cli"
sweep = "dotscripts.sweep:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dotscripts"
module-root = ""
